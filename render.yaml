services:
  - type: web
    name: patina-texture-api
    runtime: docker
    rootDir: services/texture-api
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: MODAL_TOKEN_ID
        sync: false
      - key: MODAL_TOKEN_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false